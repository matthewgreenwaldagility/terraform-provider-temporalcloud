name: sync-xp-fork

# Produces "-xp" tags that are an unmodified upstream release + the additive
# xpprovider overlay (hack/fork-overlay/). Runs from this branch (xp-tooling),
# which is the repo default branch so the schedule can fire.
on:
  schedule:
    # Daily at 06:00 UTC. Cheap: exits immediately if the -xp tag already exists.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Upstream version to base on (e.g. v1.6.0) or 'latest'"
        default: "latest"
        required: false

concurrency:
  group: sync-xp-fork
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to push the -xp tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          fetch-depth: 0 # full history + tags so ls-remote/idempotency works

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e #v7.0.0
        with:
          # The xp-tooling branch has no go.mod; pin to upstream's Go line.
          # A future upstream Go bump surfaces here as a build failure (the
          # intended "notify a human" signal).
          go-version: "1.24"

      - name: Build and push xp tag
        env:
          GIT_AUTHOR_NAME: xp-fork-bot
          GIT_AUTHOR_EMAIL: xp-fork-bot@users.noreply.github.com
        run: bash hack/sync-xp-fork.sh "${{ github.event.inputs.version || 'latest' }}"
